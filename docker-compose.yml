services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobassistant
      POSTGRES_USER: jb
      POSTGRES_PASSWORD: jb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jb -d jobassistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  api:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
